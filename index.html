<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizon City</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Barlow+Condensed:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/menus.css">
  <link rel="stylesheet" href="css/race.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/avatar.css">
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/fh5_overrides.css">
  <style>

    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#03050a; }
    /* Sky gradient behind the canvas — shows through whenever scene.background=null
       or the sky shader hasn't compiled yet. Eliminates the white-screen flash. */
    #game-canvas {
      position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0;
      background: linear-gradient(
        180deg,
        #1a6fa8 0%,        /* deep zenith blue */
        #4da6d9 25%,       /* midday sky       */
        #87ceeb 50%,       /* horizon light    */
        #d4956a 75%,       /* warm dust haze   */
        #a07050 100%       /* ground horizon   */
      );
    }

    /* ══ FH5-STYLE LOADING SCREEN ══ */
    #hc-loading-screen {
      position:fixed; inset:0; z-index:9999;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-family:'Barlow Condensed','Rajdhani',sans-serif;
      overflow:hidden; background:#03050a;
      transition:opacity 0.8s ease;
    }
    #hc-loading-screen.fading { opacity:0; pointer-events:none; }

    .hc-ls-bg {
      position:absolute; inset:0; z-index:0;
      background:
        radial-gradient(ellipse 120% 40% at 50% 0%,   rgba(6,10,20,0.9) 0%,transparent 100%),
        radial-gradient(ellipse 160% 55% at 50% 62%,  rgba(255,120,20,0.18) 0%,transparent 70%),
        radial-gradient(ellipse 100% 30% at 50% 65%,  rgba(255,85,0,0.12) 0%,transparent 60%),
        radial-gradient(ellipse 140% 50% at 50% 100%, rgba(0,0,0,0.7) 0%,transparent 70%),
        linear-gradient(180deg,#030608 0%,#060a10 30%,#0d1018 55%,#0a0c12 70%,#050507 100%);
    }
    .hc-ls-bg::after {
      content:''; position:absolute; inset:0;
      background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,0.007) 3px,rgba(255,255,255,0.007) 4px);
    }

    .hc-ls-landscape {
      position:absolute; bottom:0; left:0; right:0; height:42%; z-index:1;
      background:
        radial-gradient(ellipse 80% 120% at 50% 110%,rgba(255,95,15,0.07) 0%,transparent 60%),
        linear-gradient(180deg,transparent 0%,rgba(8,6,4,0.4) 40%,rgba(5,4,3,0.85) 70%,#030205 100%);
      clip-path:polygon(0% 100%,0% 58%,4% 52%,8% 42%,12% 36%,15% 28%,18% 24%,22% 30%,26% 22%,30% 16%,33% 20%,37% 14%,40% 8%,43% 12%,46% 6%,48% 10%,50% 4%,52% 9%,55% 3%,57% 7%,60% 11%,63% 18%,67% 22%,70% 16%,73% 20%,76% 28%,80% 24%,83% 32%,86% 36%,89% 44%,92% 52%,96% 58%,100% 60%,100% 100%);
    }

    .hc-ls-corner {
      position:absolute; top:clamp(16px,3vh,28px); left:clamp(20px,3vw,36px); z-index:20;
      font-size:0.6rem; font-weight:700; letter-spacing:0.3em;
      color:rgba(255,255,255,0.14); text-transform:uppercase;
    }

    .hc-ls-content {
      position:relative; z-index:10;
      display:flex; flex-direction:column; align-items:center; gap:0;
      margin-top:-8vh;
    }
    .hc-ls-studio {
      font-size:clamp(0.55rem,1.4vw,0.85rem); font-weight:500; letter-spacing:0.45em;
      color:rgba(255,255,255,0.28); text-transform:uppercase; margin-bottom:12px;
    }
    .hc-ls-logo { display:flex; flex-direction:column; align-items:center; line-height:0.88; }
    .hc-ls-title-top {
      font-size:clamp(3.5rem,11vw,9rem); font-weight:800; letter-spacing:0.06em;
      text-transform:uppercase; color:#ffffff;
      text-shadow:0 0 80px rgba(255,255,255,0.06),0 2px 4px rgba(0,0,0,0.8);
    }
    .hc-ls-title-bot {
      font-size:clamp(2rem,6.5vw,5.4rem); font-weight:700; letter-spacing:0.32em;
      text-transform:uppercase; color:#FF6B00;
      text-shadow:0 0 40px rgba(255,107,0,0.5),0 0 80px rgba(255,107,0,0.2),0 2px 4px rgba(0,0,0,0.8);
      margin-top:2px;
    }
    .hc-ls-divider {
      width:clamp(60px,12vw,100px); height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,107,0,0.7),transparent);
      margin:18px auto;
    }
    .hc-ls-tagline {
      font-size:clamp(0.6rem,1.6vw,0.9rem); font-weight:600; letter-spacing:0.5em;
      color:rgba(255,255,255,0.22); text-transform:uppercase;
    }

    .hc-ls-bar-zone {
      position:absolute; bottom:0; left:0; right:0; z-index:20;
    }
    .hc-ls-status {
      font-size:clamp(0.5rem,1.1vw,0.72rem); font-weight:500; letter-spacing:0.25em;
      color:rgba(255,255,255,0.22); text-transform:uppercase;
      text-align:right; padding-right:clamp(16px,3vw,32px); padding-bottom:6px;
    }
    .hc-ls-bar-track { width:100%; height:3px; background:rgba(255,255,255,0.06); position:relative; overflow:hidden; }
    .hc-ls-bar-fill {
      position:absolute; top:0; left:0; height:100%; width:0%;
      background:linear-gradient(90deg,#FF5500,#FF8C00,#FFAA00);
      transition:width 0.4s ease;
    }
    .hc-ls-bar-fill::after {
      content:''; position:absolute; top:-2px; right:0; width:40px; height:7px;
      background:radial-gradient(ellipse at center,rgba(255,220,150,0.9),transparent 70%);
      filter:blur(2px); animation:hc-bar-glow 0.8s ease-in-out infinite alternate;
    }
    @keyframes hc-bar-glow { from{opacity:.7;width:30px} to{opacity:1;width:50px} }
    .hc-ls-bar-fill.shimmer {
      width:100% !important;
      background:linear-gradient(90deg,transparent 0%,rgba(255,107,0,0.3) 20%,rgba(255,170,50,0.6) 50%,rgba(255,107,0,0.3) 80%,transparent 100%);
      background-size:200% 100%;
      animation:hc-shimmer-slide 1.6s linear infinite;
    }
    @keyframes hc-shimmer-slide { from{background-position:-200% center} to{background-position:200% center} }

    .hc-ls-pulse {
      position:absolute; bottom:28px; left:clamp(16px,3vw,32px);
      display:flex; align-items:center; gap:8px; z-index:20;
    }
    .hc-ls-pulse-dot {
      width:5px; height:5px; border-radius:50%; background:#FF6B00;
      animation:hc-pulse-dot 1.2s ease-in-out infinite;
      box-shadow:0 0 6px rgba(255,107,0,0.6);
    }
    @keyframes hc-pulse-dot { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1.2)} }
    .hc-ls-pulse-text {
      font-size:0.62rem; font-weight:600; letter-spacing:0.2em;
      color:rgba(255,255,255,0.2); text-transform:uppercase;
    }

    /* ══ COUNTDOWN ══ */
    #hc-countdown-overlay {
      position:fixed; inset:0; z-index:850;
      display:flex; align-items:center; justify-content:center;
      pointer-events:none; background:transparent;
    }
    #hc-countdown-number {
      font-family:'Barlow Condensed','Rajdhani',sans-serif;
      font-size:clamp(6rem,22vw,14rem); font-weight:800; color:#fff;
      letter-spacing:-0.02em;
      text-shadow:0 0 60px rgba(255,107,0,0.6),0 0 120px rgba(255,107,0,0.3),0 4px 20px rgba(0,0,0,0.8);
    }

  </style>
  <script type="importmap">

    "imports": {
      "three":                     "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/examples/jsm/":       "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "three/addons/":             "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "howler":                    "https://esm.sh/howler@2.2.4",
      "@dimforge/rapier3d-compat": "./js/engine/rapier-stub.js"
    }
  }
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="hc-hud-root"></div>
  <div id="hc-phone-menu"></div>
  <div id="hc-map-container"></div>
  <div id="hc-shop-container"></div>
  <div id="hc-race-setup"></div>
  <div id="hc-race-results"></div>
  <div id="hc-countdown-overlay"><span id="hc-countdown-number"></span></div>
  <div id="hc-loading-screen">
    <div class="hc-ls-bg"></div>
    <div class="hc-ls-landscape"></div>
    <div class="hc-ls-corner">A Horizon City Production</div>
    <div class="hc-ls-content">
      <div class="hc-ls-studio">Open World Racing</div>
      <div class="hc-ls-logo">
        <div class="hc-ls-title-top">HORIZON</div>
        <div class="hc-ls-title-bot">CITY</div>
      </div>
      <div class="hc-ls-divider"></div>
      <div class="hc-ls-tagline">Open World &nbsp;&middot;&nbsp; Free Roam &nbsp;&middot;&nbsp; Racing</div>
    </div>
    <div class="hc-ls-bar-zone">
      <div class="hc-ls-pulse">
        <div class="hc-ls-pulse-dot"></div>
        <div class="hc-ls-pulse-text">Initialising world&hellip;</div>
      </div>
      <div class="hc-ls-status"><span></span></div>
      <div class="hc-ls-bar-track">
        <div class="hc-ls-bar-fill shimmer" id="hc-ls-bar"></div>
      </div>
    </div>
</div>
  <script type="module">
    window.__hcTopbarInit = function() {};
    window.__hcUpdateLoadingBar = function(pct) {
      const bar = document.getElementById('hc-ls-bar');
      if (!bar) return;
      bar.classList.remove('shimmer');
      bar.style.width = Math.min(100, pct) + '%';
    };
  </script>

  <!-- ══════════════════════════════════════════════════════════════════════
       SKY + GRAPHICS LIVE PATCHER
       Runs alongside main.js as a second module.  Imports the shared
       renderer singletons (scene / camera / renderer) that main.js already
       populated, then polls every animation frame to keep the sky healthy.

       What it does each frame:
         1. Scales the SkyDome mesh to fit the camera far-plane.
         2. Ensures scene.background is never null (fallback sky-blue).
         3. Updates a <meta> debug tag so DevTools shows current sky state.
       ══════════════════════════════════════════════════════════════════════ -->
  <script type="module">
    // ── Preset gate ──────────────────────────────────────────────────────────
    // 'low' preset cuts the camera far plane to 200 m which clips the sky dome.
    // Silently upgrade to 'medium' on first visit so the sky always renders.
    // Player can still lower it in Settings → Graphics afterwards.
    (function _enforceMinPreset() {
      try {
        const p = localStorage.getItem('graphicsPreset');
        if (!p || p === 'low') {
          localStorage.setItem('graphicsPreset', 'medium');
          console.info('[SkyPatch] graphicsPreset upgraded low→medium for sky rendering.');
        }
      } catch (_) { /* private/incognito — ignore */ }
    })();

    // ── Wait for renderer module to hydrate its exports ───────────────────────
    // main.js is a separate module so its top-level await finishes before the
    // game loop starts.  We poll until `scene` and `camera` are non-null.
    let _patchActive = false;

    async function _waitForRenderer() {
      const mod = await import('./js/engine/renderer.js');
      return mod;
    }

    _waitForRenderer().then(({ scene, camera, renderer }) => {
      if (!scene || !camera || !renderer) {
        // Retry once in 2 s (modules load but singletons are set async)
        setTimeout(() => _waitForRenderer().then(startPatch), 2000);
        return;
      }
      startPatch({ scene, camera, renderer });
    });

    function startPatch({ scene, camera, renderer }) {
      if (_patchActive) return;
      _patchActive = true;
      console.info('[SkyPatch] Live sky patcher active.');

      // Fallback sky colour — matches the CSS gradient horizon tint
      const _SKY_FALLBACK  = 0x87ceeb;

      function _patch() {
        if (!scene || !camera) return;

        // ① Keep scene.background set — never let it go null
        if (scene.background === null || scene.background === undefined) {
          scene.background = new (renderer.constructor.Color ?? Object)();
          // THREE.Color is on the scene graph — grab it from scene.background's constructor
          try { scene.background = new scene.fog?.color?.constructor(0x87ceeb) ?? null; }
          catch (_) {}
          if (!scene.background) {
            // Absolute fallback: import THREE and set directly
            import('three').then(({ Color }) => {
              if (!scene.background) scene.background = new Color(_SKY_FALLBACK);
            });
          }
        }

        // ② Scale SkyDome to 90 % of camera.far so it always sits inside frustum
        const sky = scene.getObjectByName('SkyDome');
        if (sky && camera.far) {
          const targetScale = Math.min(500_000, camera.far * 0.9);
          if (Math.abs(sky.scale.x - targetScale) > 1000) {
            sky.scale.setScalar(targetScale);
          }
          // Follow camera so it's always centred in the view
          sky.position.copy(camera.position);
        }

        requestAnimationFrame(_patch);
      }

      requestAnimationFrame(_patch);
    }
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
